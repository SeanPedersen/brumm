[workspace]
resolver = "3"
members = ["crates/brumm-core", "crates/brumm-host", "crates/brumm-cli", "crates/brumm-app", "crates/brumm-worker"]
# Plain `cargo run` / `cargo test` stay on the native app; brumm-worker is the browser-only
# core thread and is built by `trunk` (issue #2). brumm-cli is left out so `cargo run` has a
# single binary to pick; build and test it with `-p brumm-cli`.
default-members = ["crates/brumm-core", "crates/brumm-host", "crates/brumm-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SeanPedersen/brumm"

[workspace.dependencies]
brumm-core = { path = "crates/brumm-core" }
brumm-host = { path = "crates/brumm-host" }
anyhow = "1.0.104"
thiserror = "2.0.21"
# Only features that build on wasm32; native crates add `rt-multi-thread` themselves.
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
iroh = "1.5.0"
# Group distribution (SPEC.md §14.4): one gossip topic per group. Phones/browsers join with a small active view.
iroh-gossip = { version = "0.103.0", default-features = false, features = ["net"] }
# Group keys (SPEC.md §14.3): HPKE (X25519-HKDF-SHA256, ChaCha20-Poly1305) for rekey slots, AEAD for messages.
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
chacha20poly1305 = "0.11.0"
url = "2"
# Spawn + timers that run on tokio natively and on setTimeout/spawn_local in the browser.
n0-future = "0.3.2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
ed25519-dalek = { version = "3.0.0", features = ["serde"] }
bip39 = "3.0.0"
vodozemac = "0.11.2"
nostr-sdk = "0.45.6"
nostr = { version = "0.45.7", features = ["nip44", "os-rng"] }
rand = "0.10.4"
blake3 = "1.8.7"
data-encoding = "2.11.1"
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
eframe = "0.37.0"
egui = "0.37.0"
qrcode = { version = "0.14.1", default-features = false }
jiff = "1.0.1"

# Lets the app see Ctrl+V when the clipboard holds a copied file (see vendor/egui-winit/src/lib.rs, "brumm patch").
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

# Everyday optimized build: `cargo build --release`.
[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Slow, smallest/fastest binary for shipping: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
