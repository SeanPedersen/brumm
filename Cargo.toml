[workspace]
resolver = "3"
members = ["crates/brumm-core", "crates/brumm-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
brumm-core = { path = "crates/brumm-core" }
anyhow = "1.0.104"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
iroh = "1.4.1"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
ed25519-dalek = { version = "3.0.0", features = ["serde"] }
bip39 = "3.0.0"
rand = "0.10.4"
blake3 = "1.8.7"
data-encoding = "2.11.1"
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
eframe = "0.37.0"
egui = "0.37.0"
qrcode = { version = "0.14.1", default-features = false }
jiff = "1.0.1"
