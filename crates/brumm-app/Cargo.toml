[package]
name = "brumm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "brumm"
path = "src/main.rs"

[dependencies]
brumm-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe.workspace = true
egui.workspace = true
qrcode.workspace = true
jiff.workspace = true
egui_extras = { version = "0.37.0", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
