[package]
name = "brumm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "brumm"
path = "src/main.rs"

[dependencies]
brumm-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# OpenGL instead of Vulkan/wgpu: much lower RSS and faster start (no GPU-driver
# compiler libraries loaded). Everything we use is in these features.
eframe = { workspace = true, default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
egui.workspace = true
qrcode.workspace = true
jiff.workspace = true
egui_extras = { version = "0.37.0", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Scaled IDCT (1/2, 1/4, 1/8) so a 4K photo never becomes a full-size bitmap.
jpeg-decoder = { version = "0.3.2", default-features = false }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

# Adwaita window buttons on Wayland. GNOME leaves the frame to the client, and
# eframe's `wayland` feature stops at winit's plain square buttons. This is the
# feature ZapFast enables: rounded Adwaita min, max and close in the desktop's
# button layout (`gsettings` `button-layout`). The feature unifies onto eframe's
# winit. The UI theme is dark, and egui forwards that to the frame.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }
