[package]
name = "brumm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "brumm"
path = "src/main.rs"

[dependencies]
brumm-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
egui.workspace = true
qrcode.workspace = true
jiff.workspace = true
# Markdown in text messages; parsing only (no HTML renderer).
pulldown-cmark = { version = "0.13.6", default-features = false }
egui_extras = { version = "0.37.0", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Scaled IDCT (1/2, 1/4, 1/8) so a 4K photo never becomes a full-size bitmap.
jpeg-decoder = { version = "0.3.2", default-features = false }
# `std::time::Instant` panics in the browser; this is `std`'s on native.
web-time = "1.1.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
brumm-host.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
directories.workspace = true
tracing-subscriber.workspace = true
# OpenGL instead of Vulkan/wgpu: much lower RSS and faster start (no GPU-driver
# compiler libraries loaded). Everything we use is in these features.
eframe = { workspace = true, default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

# Browser build (#2): egui on a canvas; the core runs in the brumm-worker Web Worker.
[target.'cfg(target_family = "wasm")'.dependencies]
eframe = { workspace = true, default-features = false, features = ["default_fonts", "glow"] }
tokio = { workspace = true, features = ["sync"] }
jiff = { workspace = true, features = ["js"] }
postcard.workspace = true
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "Blob",
    "BlobPropertyBag",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "History",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "Node",
    "Response",
    "Url",
    "UrlSearchParams",
    "VisibilityState",
    "Window",
    "Worker",
] }
console_error_panic_hook = "0.1.7"
tracing-subscriber = { workspace = true, default-features = false, features = ["fmt", "env-filter"] }
tracing-web = "0.1.3"
# Links brumm-core whole (the core itself runs in brumm-worker); this supplies the SQLite host
# callbacks it references. The linker drops the unused code.
sqlite-wasm-rs = { version = "0.6.3", features = ["wasm-bindgen"] }

# Adwaita window buttons on Wayland. GNOME leaves the frame to the client, and
# eframe's `wayland` feature stops at winit's plain square buttons. This is the
# feature ZapFast enables: rounded Adwaita min, max and close in the desktop's
# button layout (`gsettings` `button-layout`). The feature unifies onto eframe's
# winit. The UI theme is dark, and egui forwards that to the frame.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }
