[package]
name = "brumm-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser build: runs brumm-core inside a dedicated Web Worker (OPFS needs one)."
publish = false

# Only meaningful for wasm32-unknown-unknown; `trunk` builds it from crates/brumm-app/index.html.
[target.'cfg(target_family = "wasm")'.dependencies]
brumm-core.workspace = true
anyhow.workspace = true
postcard.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, default-features = false, features = ["fmt", "env-filter"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent"] }
console_error_panic_hook = "0.1.7"
tracing-web = "0.1.3"
# Same sqlite-wasm-rs as rusqlite's; the feature adds the JS time/random host callbacks.
sqlite-wasm-rs = { version = "0.6.3", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3.0", features = ["sahpool"] }
